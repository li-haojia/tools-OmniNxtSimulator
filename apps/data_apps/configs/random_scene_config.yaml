# Environment generation settings
launch_config:
  renderer: "RayTracedLighting"
  headless: True
  livestream: 2

env_spacing: 20.0
map_generator_config:
  num_obstacles: 300
  min_distance: 0.1
  obstacle_size_range: [0.3, 1.0]
  obstacle_height_range: [0.5, 3.0]
  num_floaters: 200
  floaters_size_range: [0.1, 0.5]
  floaters_height_range: [1.0, 3.0]
voxel_width: 0.1

# Output paths
data_path: "data_apps/assets/random"
pcd_name: "generated_environment.pcd"
env_name: "generated_environment.usd"
trajectory_name: "generated_trajectories.h5"

# Trajectory generation settings
num_trajectories: 100
planner_config:
  dilate_radius: 0.2
  map_bound: [-12.0, 12.0, -12.0, 12.0, 0.0, 3.0]
  timeout_rrt: 2.0
  max_vel_mag: 3.0
  max_tilt_angle: 35.0  # in degrees
  data_gen_goal_bound: [-9.5, 9.5, -9.5, 9.5, 0.25, 2.3]
  seed: 42
  minTrajDuration: 4.0
  minDist: 5.0

# Path tracking settings
sample_interval: 50
start_group: 0
end_group: -1

image_output_path: "path_tracking_sdg"
writer: "BasicWriter"
writer_config:
  camera_params: True
  rgb: False
  distance_to_camera: False
  distance_to_image_plane: True
  colorize_depth: True
  instance_segmentation: False
  colorize_instance_segmentation: False
  semantic_segmentation: False
  colorize_semantic_segmentation: False
  bounding_box_2d_tight: False
  bounding_box_3d: False
  use_common_output_dir: False

save_trajectory_info: True
clear_previous_semantics: False


# General settings
close_app_after_run: true 